{
  "name": "WayPoint: report a bug",
  "description": "Report a problem with the WayPoint Android app.",
  "title": "[WayPoint] ",
  "labels": [
    "app:waypoint",
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Reports are public. Do not include precise locations, passwords, or personal information."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "App version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "device",
      "attributes": {
        "label": "Device model and Android version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "What happened?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "What did you expect?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Screenshots or additional details"
      },
      "validations": {
        "required": false
      }
    }
  ]
}
